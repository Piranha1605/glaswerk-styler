<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Rahmen 5 - Das Feuerwerk. 4,5 s, kein Text. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: linear-gradient(145deg, #0d141f 0%, #16202f 52%, #0a111a 100%);
        }
        #f6-knopf-huelle {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 340px;
          height: 340px;
          margin: -170px 0 0 -170px;
          border-radius: 28px;
          overflow: hidden;
          box-shadow: inset 0 1.5px 0 0 rgba(255, 255, 255, 0.16),
            inset 0 -1.5px 0 0 rgba(0, 0, 0, 0.35), 0 20px 52px rgba(0, 0, 0, 0.5);
        }
        #f6-knopf {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        /* Die Teilchen. Jedes ist ein Block mit eigener Groesse - ein
           transformiertes Element muss ein Block sein und Maße haben
           (determinism-rules). */
        .f6-teil {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 18px;
          height: 18px;
          margin: -9px 0 0 -9px;
          border-radius: 50%;
          display: block;
        }
        /* DIE FUENF SPLITTER TRAGEN ECHTE KARTEN, jede aus der Aufnahme
           IHRES Stils (bilder/karten/, geschnitten aus 02-handschrift-*).
           Vorher waren es leere Flaechen - der Stil war da, die Karte nicht,
           und damit fehlte genau das, was der Film zeigen soll.
           Die Flaeche steckt jetzt im Bild; was hier bleibt, ist die Kante
           des Stils: sein Schatten und seine Rundung. */
        .f6-splitter {
          position: absolute;
          left: 50%;
          top: 50%;
          width: 272px;
          height: 264px;
          margin: -132px 0 0 -136px;
          border-radius: 20px;
          overflow: hidden;
          display: block;
        }
        .f6-splitter img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #f6-s1 {
          box-shadow: inset 0 1.5px 0 0 rgba(255, 255, 255, 0.16),
            inset 0 -1.5px 0 0 rgba(0, 0, 0, 0.35), 0 20px 52px rgba(0, 0, 0, 0.5);
        }
        #f6-s2 {
          box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.3), inset 0 1.5px 0 rgba(255, 255, 255, 0.5),
            0 28px 60px rgba(0, 0, 0, 0.55);
        }
        #f6-s3 {
          box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.22), 0 12px 32px rgba(0, 0, 0, 0.5);
        }
        #f6-s4 {
          box-shadow: -6px -6px 14px rgba(255, 255, 255, 0.05), 6px 6px 16px rgba(0, 0, 0, 0.6);
        }
        #f6-s5 {
          box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.16), 0 14px 34px rgba(0, 0, 0, 0.5);
        }
      </style>

      <div data-hf-id="hf-fj6v" id="root" data-composition-id="f6-feuerwerk" data-width="1920" data-height="1080">
        <div data-hf-id="hf-46gr" id="f6-knopf-huelle" class="clip" data-start="0" data-duration="4.5" data-track-index="0">
          <img data-hf-id="hf-gqm1" id="f6-knopf" src="bilder/04-knopf.png" alt="" />
        </div>
        <div data-hf-id="hf-syvi" id="f6-teilchen" class="clip" data-start="0.5" data-duration="4" data-track-index="1"></div>
        <div data-hf-id="hf-279k" id="f6-splitter" class="clip" data-start="0.5" data-duration="4" data-track-index="2">
          <i data-hf-id="hf-6pv5" class="f6-splitter" id="f6-s1"><img src="bilder/karten/s1-leistung.png" alt="" /></i>
          <i data-hf-id="hf-anz6" class="f6-splitter" id="f6-s2"><img src="bilder/karten/s2-ladestand.png" alt="" /></i>
          <i data-hf-id="hf-em37" class="f6-splitter" id="f6-s3"><img src="bilder/karten/s3-wetter.png" alt="" /></i>
          <i data-hf-id="hf-r4lo" class="f6-splitter" id="f6-s4"><img src="bilder/karten/s4-medien.png" alt="" /></i>
          <i data-hf-id="hf-rw9h" class="f6-splitter" id="f6-s5"><img src="bilder/karten/s5-schalter.png" alt="" /></i>
        </div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Die sieben klassischen Toene, aus denen Home Assistant seine 86
        // Zustandsfarben rechnet - frame.md.
        const TOENE = ["#f44336", "#ff9800", "#ffc107", "#4caf50", "#00bcd4", "#2196f3", "#926bc7"];

        // 36 Teilchen, ballistisch, INDEX-GESAET. Kein Math.random: Der
        // Winkel kommt aus dem goldenen Winkel, die Weite aus einer
        // Sinusfolge - zweimal gerechnet ergibt zweimal dasselbe Bild, und
        // genau das verlangt ein Renderer, der Bild fuer Bild springt.
        const feld = document.getElementById("f6-teilchen");
        const teilchen = [];
        for (let i = 0; i < 36; i++) {
          const el = document.createElement("i");
          el.className = "f6-teil";
          const ton = TOENE[i % TOENE.length];
          el.style.background = ton;
          el.style.boxShadow = `0 0 18px ${ton}`;
          feld.appendChild(el);
          const winkel = i * 137.508 * (Math.PI / 180);
          const weite = 420 + 300 * Math.abs(Math.sin(i * 1.7));
          teilchen.push({
            el,
            x: Math.cos(winkel) * weite,
            y: Math.sin(winkel) * weite * 0.62,
            dreh: (i % 2 ? 1 : -1) * (120 + (i % 5) * 40),
            gr: 0.5 + ((i * 7) % 11) / 11,
          });
        }

        // 1. Der Knopf wird gedrueckt: linear gestaucht, dann federt er.
        tl.to("#f6-knopf-huelle", { scale: 0.88, duration: 0.22, ease: "power2.in" }, 0.18);
        tl.to("#f6-knopf-huelle", { scale: 1.06, duration: 0.3, ease: "back.out(3)" }, 0.4);
        tl.to("#f6-knopf-huelle", { scale: 1, duration: 0.2, ease: "power2.out" }, 0.7);

        // 2. Im Moment der Rueckfederung zuendet das Feuerwerk.
        teilchen.forEach((t, i) => {
          const los = 0.5 + (i % 6) * 0.015;
          tl.fromTo(
            t.el,
            { x: 0, y: 0, scale: 0, opacity: 1, rotation: 0 },
            { x: t.x, y: t.y, scale: t.gr, rotation: t.dreh, duration: 1.5 + (i % 4) * 0.12, ease: "power3.out" },
            los
          );
          // Der Fall danach - ballistisch, nicht schwebend.
          tl.to(t.el, { y: t.y + 260, opacity: 0, duration: 1.6, ease: "power1.in" }, los + 1.1);
        });

        // 3. Die fuenf Stile fliegen als Glassplitter durchs Bild.
        const splitter = [
          { el: "#f6-s1", x: -640, y: -240, r: -22 },
          { el: "#f6-s2", x: 600, y: -300, r: 18 },
          { el: "#f6-s3", x: -720, y: 260, r: 14 },
          { el: "#f6-s4", x: 660, y: 240, r: -16 },
          { el: "#f6-s5", x: 0, y: 420, r: 8 },
        ];
        splitter.forEach((s, i) => {
          tl.fromTo(
            s.el,
            { x: 0, y: 0, scale: 0.2, opacity: 0, rotation: 0 },
            { x: s.x, y: s.y, scale: 1, opacity: 1, rotation: s.r, duration: 1.1, ease: "power3.out" },
            0.56 + i * 0.05
          );
          tl.to(s.el, { opacity: 0, scale: 0.86, duration: 0.9, ease: "power2.in" }, 3.1 + i * 0.05);
        });

        // Der Knopf tritt zurueck, waehrend die Splitter kommen - erst NACH
        // der Rueckfederung. Zwei Tweens auf derselben Eigenschaft zur
        // selben Zeit streiten, und wer gewinnt, haengt an der Reihenfolge.
        tl.to("#f6-knopf-huelle", { opacity: 0, scale: 0.7, duration: 0.8, ease: "power2.in" }, 0.95);

        window.__timelines["f6-feuerwerk"] = tl;
      </script>
    </template>
  </body>
</html>

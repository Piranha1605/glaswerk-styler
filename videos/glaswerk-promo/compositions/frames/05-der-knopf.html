<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Rahmen 5 - Was der Knopf tut. 12 s, der wichtigste Teil des Films.
         Gemeldet am 15.10.2026: "aber der ganze wichtige teil die funktion
         des knopfes und der karte fehlt". Vorher sprang der Film vom Zoom
         auf das Zahnrad direkt ins Feuerwerk - der Knopf wurde also gezeigt
         und nie benutzt.

         Das Material ist eine ECHTE Aufnahme der Testmaschine
         (werkzeuge/test/film-aufnehmen.mjs --fenster): Zahnrad, Fenster,
         drei Kartenstile, die Hintergruende, Hell, Dunkel, zu. Jeder Klick
         hat dabei wirklich die Theme-Datei geschrieben; die Datei der
         Maschine war vorher gesichert und ist Byte fuer Byte zurueck. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: linear-gradient(145deg, #0d141f 0%, #16202f 52%, #0a111a 100%);
          font-family: system-ui, ui-sans-serif, sans-serif;
        }
        /* Die Kamera. Sie traegt KEIN data-start - ein <video data-start>
           darf keinen zeitgesteuerten Vorfahren haben (lint:
           video_nested_in_timed_element). Die Zeit steht am Video, die
           Bewegung an der Huelle. */
        #f5-kamera {
          position: absolute;
          inset: 0;
          /* Der Druck geht auf die Mitte des Fensters, nicht auf die
             Bildmitte: Der Dialog sitzt bei 520..1400 x 200..880, sein
             Mittelpunkt also bei 960 / 540 - zufaellig genau die Mitte.
             Der Wert steht trotzdem ausgeschrieben da, damit er beim
             naechsten Zuschnitt nicht geraten wird. */
          transform-origin: 960px 540px;
        }
        #f5-film {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
          display: block;
        }
        /* Der Rand dunkelt ab, damit das Fenster traegt. */
        #f5-vignette {
          position: absolute;
          inset: 0;
          pointer-events: none;
          background: radial-gradient(118% 88% at 50% 50%, rgba(0, 0, 0, 0) 52%, rgba(0, 0, 0, 0.55) 100%);
        }
        /* Die Zeilen stehen unten links, wie in Rahmen 3 und 4 - eine Stelle
           fuer Text im ganzen Film. Jede ist ein eigener Clip; ein
           ausgetauschter Text waere nicht suchsicher. */
        /* DIE ZEILEN STEHEN AUF GLAS, nicht auf dem Bild. In dieser Szene
           schaltet die Theme auf Hell um - gemessen bei 31 s stand weisse
           Schrift auf hellem Grund, und die Kontrastpruefung sieht das nicht,
           weil ein Video dahinterliegt und kein Farbwert. Die Platte ist
           dieselbe, die Rahmen 7 benutzt, also dieselbe Karte wie ueberall. */
        .f5-zeile {
          position: absolute;
          left: 96px;
          bottom: 96px;
          font-size: 52px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }

        /* DIE GLASPLATTE unter jeder Beschriftung. Auf Ansage vom
           15.10.2026: "leg die overlays auf eine glasplatte und macht die
           schriftfarbe auch zum glaslook".

           Sie loest nebenbei ein Problem, das zweimal gemessen wurde: Die
           Theme schaltet im Film auf Hell, und weisse Schrift auf hellem
           Grund faellt der Kontrastpruefung nicht auf, weil ein Bild oder
           ein Video dahinterliegt und kein Farbwert. Auf einer dunklen
           Platte traegt die Schrift in beiden Modi, ohne Tricks. */
        .glasplatte {
          padding: 16px 32px;
          border-radius: 18px;
          /* 0,84 statt 0,62: Bei 0,62 zog der backdrop-filter auf dem HELLEN
             Theme so viel Helligkeit herauf, dass die Platte hellblau wurde
             und die helle Glasschrift darauf verschwand - gemessen bei 13 s.
             Die Platte muss dunkel sein, egal was dahinterliegt; die
             Weichzeichnung macht die Kanten, nicht die Farbe. */
          background: linear-gradient(150deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.012) 58%),
            rgba(10, 15, 26, 0.84);
          backdrop-filter: blur(28px) saturate(180%);
          box-shadow: inset 0 1.5px 0 0 rgba(255, 255, 255, 0.26),
            inset 0 0 0 1px rgba(255, 255, 255, 0.08),
            inset 0 -1.5px 0 0 rgba(0, 0, 0, 0.4),
            0 24px 60px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.35);
        }
        /* UND DIE SCHRIFT SELBST IST GLAS: hell an der Oberkante, matter im
           Bauch, wieder hell an der Unterkante - so faengt eine geschliffene
           Kante das Licht. Dazu ein feiner Schliff als Strich und ein Schein
           nach aussen.

           Die Fuellung ist durchsichtig und kommt aus dem Verlauf. Das ist
           der Fall, den die Layoutpruefung als beabsichtigt kennt
           (background-clip: text) - eine durchsichtige Schrift OHNE ihn
           meldet sie zu Recht als nicht gemalt. */
        .glasschrift {
          color: transparent;
          -webkit-background-clip: text;
          background-clip: text;
          background-image: linear-gradient(180deg,
            rgba(255, 255, 255, 0.98) 0%, rgba(232, 243, 255, 0.92) 30%,
            rgba(198, 224, 252, 0.86) 60%, rgba(236, 246, 255, 0.99) 100%);
          -webkit-text-stroke: 0.9px rgba(226, 243, 255, 0.38);
          filter: drop-shadow(0 0 16px rgba(150, 200, 255, 0.38))
            drop-shadow(0 2px 3px rgba(0, 0, 0, 0.55));
        }
      </style>

      <div id="root" data-composition-id="f5-der-knopf" data-width="1920" data-height="1080">
        <div id="f5-kamera" data-layout-allow-overflow>
          <video
            id="f5-film"
            class="clip"
            src="filme/04-einstellungen.mp4"
            muted
            playsinline
            data-start="0"
            data-duration="12"
            data-playback-rate="1.5"
            data-track-index="0"
          ></video>
        </div>
        <div id="f5-vignette"></div>

        <div class="f5-zeile clip glasplatte" id="f5-z1" data-start="1.5" data-duration="2.9" data-track-index="1"><span class="glasschrift">Change it where you see it.</span></div>
        <div class="f5-zeile clip glasplatte" id="f5-z2" data-start="5.0" data-duration="3.0" data-track-index="2"><span class="glasschrift">Pick a style — every card follows.</span></div>
        <div class="f5-zeile clip glasplatte" id="f5-z3" data-start="8.6" data-duration="3.4" data-track-index="3"><span class="glasschrift">Background, motion, light and dark.</span></div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Die Kamera steht erst still - der Schnitt kommt aus der Nahaufnahme
        // des Zahnrads, und ein sofortiger Druck darauf waere eine Bewegung
        // zu viel. Ab 1,2 s schiebt sie langsam auf das Fenster zu.
        tl.fromTo(
          "#f5-kamera",
          { scale: 1.0 },
          { scale: 1.22, duration: 10.8, ease: "power1.inOut" },
          1.2
        );

        // Das Bild kommt aus dem Dunkeln, wie in Rahmen 1 - sonst springt
        // der Schnitt.
        tl.fromTo("#f5-film", { opacity: 0 }, { opacity: 1, duration: 0.45, ease: "power2.out" }, 0);

        // Die drei Zeilen: auf und wieder ab. Die Werte stehen im fromTo,
        // nicht im CSS (lint: gsap_css_transform_conflict).
        [
          ["#f5-z1", 1.5, 4.0],
          ["#f5-z2", 5.0, 7.6],
          ["#f5-z3", 8.6, 11.4],
        ].forEach(([el, an, aus]) => {
          tl.fromTo(el, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, an);
          tl.to(el, { opacity: 0, duration: 0.4, ease: "power2.in" }, aus);
        });

        window.__timelines["f5-der-knopf"] = tl;
      </script>
    </template>
  </body>
</html>

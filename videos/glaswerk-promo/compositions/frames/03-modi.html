<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <!-- Rahmen 3 - Hell und dunkel. 4 s. -->
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          overflow: hidden;
          background: #0a111a;
          font-family: system-ui, ui-sans-serif, sans-serif;
        }
        .f3-lage {
          position: absolute;
          inset: 0;
          width: 1920px;
          height: 1080px;
          object-fit: cover;
        }
        /* Die helle Lage liegt oben und wird von einem schraegen Schnitt
           freigegeben. clip-path statt Deckkraft: Eine Blende macht beide
           Welten gleichzeitig halb sichtbar - ein Schnitt zeigt immer genau
           eine, und die Kante IST der Effekt. */
        #f3-hell-huelle {
          position: absolute;
          inset: 0;
        }
        /* Der Lichtstrich auf der Kante. Er laeuft mit demselben Wert wie der
           Schnitt, deshalb steht er nie daneben. */
        #f3-strich {
          position: absolute;
          top: -14%;
          left: 0;
          width: 160px;
          height: 128%;
          transform: rotate(10deg);
          pointer-events: none;
          background: linear-gradient(
            90deg,
            rgba(255, 255, 255, 0) 0%,
            rgba(255, 255, 255, 0.22) 46%,
            rgba(255, 255, 255, 0.72) 50%,
            rgba(255, 255, 255, 0.22) 54%,
            rgba(255, 255, 255, 0) 100%
          );
          mix-blend-mode: screen;
        }
        /* EINE Zeile, auf einer Glasplatte.

           Hier standen bis zum 15.10.2026 ZWEI: eine helle und eine dunkle,
           beide vom selben Schnitt wie die Blende geschnitten, weil nach der
           Blende weisse Schrift auf dem hellen Theme stand. Mit der Platte
           stellt sich die Frage nicht mehr - sie ist in beiden Modi dunkel.
           Zwei Elemente, zwei clip-path-Rechnungen und zwei Marker weniger. */
        #f3-zeile {
          position: absolute;
          left: 96px;
          top: 74px;
          font-size: 58px;
          font-weight: 600;
          letter-spacing: -0.01em;
        }

        /* DIE GLASPLATTE unter jeder Beschriftung. Auf Ansage vom
           15.10.2026: "leg die overlays auf eine glasplatte und macht die
           schriftfarbe auch zum glaslook".

           Sie loest nebenbei ein Problem, das zweimal gemessen wurde: Die
           Theme schaltet im Film auf Hell, und weisse Schrift auf hellem
           Grund faellt der Kontrastpruefung nicht auf, weil ein Bild oder
           ein Video dahinterliegt und kein Farbwert. Auf einer dunklen
           Platte traegt die Schrift in beiden Modi, ohne Tricks. */
        .glasplatte {
          padding: 16px 32px;
          border-radius: 18px;
          /* 0,84 statt 0,62: Bei 0,62 zog der backdrop-filter auf dem HELLEN
             Theme so viel Helligkeit herauf, dass die Platte hellblau wurde
             und die helle Glasschrift darauf verschwand - gemessen bei 13 s.
             Die Platte muss dunkel sein, egal was dahinterliegt; die
             Weichzeichnung macht die Kanten, nicht die Farbe. */
          background: linear-gradient(150deg, rgba(255, 255, 255, 0.07) 0%, rgba(255, 255, 255, 0.012) 58%),
            rgba(10, 15, 26, 0.84);
          backdrop-filter: blur(28px) saturate(180%);
          box-shadow: inset 0 1.5px 0 0 rgba(255, 255, 255, 0.26),
            inset 0 0 0 1px rgba(255, 255, 255, 0.08),
            inset 0 -1.5px 0 0 rgba(0, 0, 0, 0.4),
            0 24px 60px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.35);
        }
        /* UND DIE SCHRIFT SELBST IST GLAS: hell an der Oberkante, matter im
           Bauch, wieder hell an der Unterkante - so faengt eine geschliffene
           Kante das Licht. Dazu ein feiner Schliff als Strich und ein Schein
           nach aussen.

           Die Fuellung ist durchsichtig und kommt aus dem Verlauf. Das ist
           der Fall, den die Layoutpruefung als beabsichtigt kennt
           (background-clip: text) - eine durchsichtige Schrift OHNE ihn
           meldet sie zu Recht als nicht gemalt. */
        .glasschrift {
          color: transparent;
          -webkit-background-clip: text;
          background-clip: text;
          background-image: linear-gradient(180deg,
            rgba(255, 255, 255, 0.98) 0%, rgba(232, 243, 255, 0.92) 30%,
            rgba(198, 224, 252, 0.86) 60%, rgba(236, 246, 255, 0.99) 100%);
          -webkit-text-stroke: 0.9px rgba(226, 243, 255, 0.38);
          filter: drop-shadow(0 0 16px rgba(150, 200, 255, 0.38))
            drop-shadow(0 2px 3px rgba(0, 0, 0, 0.55));
        }
      </style>

      <div data-hf-id="hf-k7yc" id="root" data-composition-id="f3-modi" data-width="1920" data-height="1080">
        <img data-hf-id="hf-eu9e" class="f3-lage clip" id="f3-dunkel" src="bilder/03-dunkel.png" alt=""
             data-start="0" data-duration="4" data-track-index="0" />
        <div data-hf-id="hf-bw12" id="f3-hell-huelle" class="clip" data-start="0" data-duration="4" data-track-index="1">
          <img data-hf-id="hf-qpzm" class="f3-lage" id="f3-hell" src="bilder/03-hell.png" alt="" />
        </div>
        <div data-hf-id="hf-y6bc" id="f3-strich" class="clip" data-layout-allow-overflow data-start="0" data-duration="4" data-track-index="2"></div>
        <div data-hf-id="hf-nxbv" id="f3-zeile" class="clip glasplatte"
             data-start="0.6" data-duration="3.4" data-track-index="3"><span class="glasschrift">Light or dark.</span></div>
      </div>

      <script>
        const tl = gsap.timeline({ paused: true });

        // Der Schnitt faehrt von links nach rechts und wieder zurueck. Die
        // Zahl ist derselbe Fortschritt fuer Schnitt und Strich: ein Objekt,
        // zwei Leser - so koennen sie nicht auseinanderlaufen.
        const lauf = { p: 0 };
        const setze = () => {
          const x = lauf.p * 1920;
          // Schraeg: oben 120 px weiter als unten - dieselben 10 Grad wie der
          // Strich.
          document.getElementById("f3-hell-huelle").style.clipPath =
            `polygon(0 0, ${x + 120}px 0, ${x - 120}px 1080px, 0 1080px)`;
          document.getElementById("f3-strich").style.transform =
            `translateX(${x - 80}px) rotate(10deg)`;
        };
        setze();

        tl.to(lauf, { p: 1, duration: 1.8, ease: "power2.inOut", onUpdate: setze }, 0.1);
        tl.to(lauf, { p: 0, duration: 1.6, ease: "power2.inOut", onUpdate: setze }, 2.3);

        tl.fromTo("#f3-zeile", { opacity: 0, y: 18 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 0.6);
        tl.to("#f3-zeile", { opacity: 0, duration: 0.4, ease: "power2.in" }, 3.5);

        window.__timelines["f3-modi"] = tl;
      </script>
    </template>
  </body>
</html>

    <!-- GLASWERK - 30 Sekunden, sieben Rahmen.

             5,0   Die Handschrift         6,0 s
            11,0   Hell und dunkel         4,0 s
            15,0   Der Zoom auf den Knopf  6,0 s

            33,0   Das Feuerwerk           4,5 s
            37,5   Der Rest laeuft mit     7,0 s
            44,5   Der Name                3,5 s
                                         --------
                                           48,0 s

         Die 30 s vom ersten Entwurf waren eine Idee, kein Mass - am
         15.10.2026 ausdruecklich freigegeben: "die zeit kann auch laenger
         die 30 sec waren nur eine idee". Dazugekommen ist der Teil, der
         vorher fehlte: der Knopf wurde gezeigt und nie benutzt. -->

      <!-- ================= DAS BETT ==========================================
           Aus HeyGens Musikkatalog, gesucht und dann GEMESSEN statt nach dem
           Namen genommen (ffmpeg astats, Fenster 2 s):

               0 - 31 s   ruhiger Flaechenklang, -25 bis -30 dB
              31,0 - 31,5 faellt auf -53 dB ab: eine Atempause
              31,9 s      setzt ein, -7 dB
              32 - 64 s   voll und gleichmaessig
              66 s        Ende, danach Stille

           DER EINSATZ BEI 31,9 s IST DER GRUND FUER DIESEN START: Laeuft das
           Stueck ab Filmsekunde 1,6, faellt sein Einsatz auf Sekunde 33,5 -
           der Moment, in dem das Feuerwerk zuendet. Und die Atempause davor
           faellt auf den Druck des Knopfes.

           Zuerst stand der Start auf 3,0, weil ich den Einsatz mit Fenstern
           von 2 s auf "30 s" geschaetzt hatte. Im fertigen Film kam das Bett
           dann anderthalb Sekunden nach dem Einschlag. Fein gemessen liegt
           er bei 31,9.

           Vier andere Stuecke standen zur Wahl; drei waren von der ersten
           Sekunde an gleich laut. Ein Bett ohne Verlauf haette den Film
           flachgedrueckt, und das sieht man einem Suchergebnis nicht an -
           nur seiner Huellkurve.

           Die Lautstaerke faehrt ueber eine Automationsspur: zwei Sekunden
           Einblende, voll bis zum Endbild, dort etwas zurueck, damit der
           Schimmer im Glas noch zu hoeren ist, dann aus. -->
      <audio id="ton-bett" src=".media/audio/bgm/bgm_002.wav"
             data-start="1.6" data-duration="46.4" data-volume="0.42" data-track-index="9"
             data-automation='{"version":1,"lanes":[{"target":"volume","points":[
               {"t":0,"v":0},{"t":2.9,"v":1},{"t":42.9,"v":1},
               {"t":43.8,"v":0.66},{"t":45,"v":0.6},{"t":46.4,"v":0}]}]}'></audio>

      <!-- ================= TON =================================================
           Fuenf Klaenge aus HeyGens SFX-Katalog. Der Katalog nennt zu jedem
           seinen GIPFEL (peak_offset) - damit entfaellt das Ausmessen, und
           damit entfaellt auch der Fehler, den ich mir mit der lokalen
           Bibliothek eingebaut hatte: Dort hatte ich den Gipfel eines Risers
           mit Fenstern von 50 ms bestimmt und 0,8 s danebengelegen, hoerbar
           im fertigen Film.

               sfx_006  5,71 s  Riser,     Gipfel 5,29 s
               sfx_007  5,87 s  Einschlag, Gipfel 0,18 s
               sfx_008  4,18 s  Glas,      Gipfel 0,12 s
               sfx_009  0,24 s  Klick,     Gipfel 0,09 s
               sfx_010  1,42 s  Whoosh,    Gipfel 0,45 s

           DIE REGEL FUER JEDEN EINZELNEN: start = Zeitpunkt - Gipfel. Ein
           Klang wird auf den Moment gesetzt, an dem er am lautesten ist,
           nicht auf den, an dem er anfaengt.

           Der Riser gipfelt fast an seinem Ende (5,29 von 5,71 s) - genau
           richtig fuer einen Schnitt: Die Energie faellt hinein, statt
           danach noch zu klingeln.

           Die Toene liegen in der WURZEL und nicht in den Szenen: Beide
           Riser laufen ueber eine Szenengrenze, und ein data-start in einer
           Szene ist szenenlokal - der Riser waere dort abgeschnitten. -->

      <!-- Die kleinen Schnitte: Stile, Modi, der Zoom, der Rest. -->
      <audio id="ton-cut-stile" src=".media/audio/sfx/sfx_010.mp3"
             data-start="4.55" data-duration="1.42" data-volume="0.34" data-track-index="6"></audio>

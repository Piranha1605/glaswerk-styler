# ha_blanko - Home Assistant 2026.10 ohne Altlasten
# 
# Erzeugt aus einer laufenden Instanz (HA 2026.10.1), nicht aus Dokumentation.
# Enthaelt nur Blaetter: Felder mit festem Wert. Was Home Assistant selbst aus
# anderen Feldern ableitet (375 var()-Verweise), steht absichtlich nicht drin -
# es soll weiter abgeleitet werden.
# 
# Drei Ebenen, und die Aufteilung ist nicht kosmetisch:
# 
#   flach (243)   Werte, die in beiden Modi gleich sind. Home Assistant
#                 ueberschreibt sie im Dunkelmodus nicht - nachgewiesen daran,
#                 dass keiner dieser Namen in HAs 143 Dunkelwerten vorkommt.
#   light (27)    nur was sich zwischen hell und dunkel unterscheidet.
#   dark (143)    genau die Werte, die HA im Dunkelmodus selbst anwendet
#                 ({...darkSemanticVariables, ...darkColorVariables}).
# 
# Warum flach und nicht alles unter light: modes.light gilt NUR im Hellmodus.
# Ein Feld, das nur dort steht, fehlt im Dunkeln - und mit ihm das Tripel, das
# HA daraus ableitet (--rgb-<name>, nur fuer Werte die mit # beginnen). Mushroom
# baut seine Farben aus genau diesen Tripeln; stehen die Palettenfarben unter
# light, sind Mushroom-Karten im Dunkelmodus farblos. Ohne Fehlermeldung.
# Siehe docs/zuordnung-neue-ebene.md.


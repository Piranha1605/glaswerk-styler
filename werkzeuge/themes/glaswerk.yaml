  uix-badge: |-
    /* HATS:glas-badges:START */
    :host,
    .badge {
      backdrop-filter: var(--ha-card-backdrop-filter, blur(18px) saturate(160%));
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter, blur(18px) saturate(160%));
      border-radius: 999px;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .5);
    }
    /* HATS:glas-badges:ENDE */
  uix-card: |-
    /* HATS:glas-karten:START */
    /* Nur die Karte selbst, nicht ihr Wirt.

       Auf einem Dashboard haengt eine Karte unter hui-card, und UIX patcht dann
       das KARTEN-Element - :host ist dieses Element, ha-card die Karte darin. Ein
       Selektor ":host, ha-card" bemalt deshalb beide: Fuellung, Glanz und
       Weichzeichnung liegen doppelt uebereinander und wirken ausgewaschen.

       Und ein backdrop-filter auf dem Wirt macht ihn zum Bezugsrahmen fuer
       position: fixed. Bubble-Pop-ups sind fixed und fallen dann auf die Groesse
       des Wirts zusammen - gemessen: Hoehe 0 statt 742. */
    :host(ha-card),
    ha-card {
      /* Die KURZFORM, nicht background-color. Am 14.10.2026 gemessen: Der
         Kartenstil "Liquid Glass" legt zwei Verlaeufe in --ha-card-background,
         und background-color nimmt nur Farben - die Zeile fiel still weg. Das
         background-image: none darunter loeschte dann auch noch den Verlauf, den
         ha-card selbst gesetzt hatte. Ergebnis: eine Karte ganz ohne Fuellung,
         rgba(0,0,0,0), die nur noch von der Weichzeichnung lebte.

         Die Kurzform nimmt beides - Farbe wie Verlauf - und setzt
         background-image von sich aus zurueck. Das none darunter ist damit nicht
         nur ueberfluessig, sondern genau der Fehler. */
      background: var(--ha-card-background, var(--card-background-color)) !important;
      backdrop-filter: var(--ha-card-backdrop-filter, blur(20px) saturate(160%));
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter, blur(20px) saturate(160%));
      /* Ohne eigenen Radius zeichnet der Rand ein eckiges Rechteck um die runde Karte. */
      border-radius: var(--ha-card-border-radius, 22px) !important;
      /* Der Rand liegt als innerer Ring IM Schatten. Ein echtes border verschiebt
         das Layout um seine Breite - bei eigenen Panels rutscht damit der ganze
         Inhalt nach unten. */
      box-shadow: var(--ha-card-box-shadow) !important;
      border: 0 !important;
    }

    /* Bubble-Karten haben im Shadow Root ebenfalls eine ha-card. Die zeichnet die
       Bubble-Vorlage schon - ohne Ausnahme laege darunter ein zweites Glas.
       Ueberschriften und reine Textkarten brauchen gar keine Flaeche. */
    :host(.type-custom-bubble-card) ha-card,
    :host(hui-heading-card) ha-card,
    :host(mushroom-title-card) ha-card,
    :host(mushroom-chips-card) ha-card,
    :host(.text-only),
    ha-card.text-only {
      background: none !important;
      background-image: none !important;
      border: 0 !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    /* Auswahlfelder und Menues bleiben deckend - durchscheinend sind sie
       unlesbar, weil der Text der Karte darunter durchschlaegt. */
    ha-dropdown,
    ha-combo-box,
    ha-select,
    vaadin-combo-box-overlay,
    .menu-surface,
    .mdc-menu-surface,
    mwc-menu-surface {
      --ha-card-background: var(--card-background-color) !important;
      background-color: var(--card-background-color) !important;
      background-image: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }

    /* Bubble legt ein unsichtbares ha-select als Klickflaeche ueber runde
       Auswahl-Sub-Buttons. Mit deckender Farbe wird daraus ein eckiges dunkles
       Quadrat mitten auf dem Knopf. */
    ha-select.bubble-dropdown-select {
      background-color: transparent !important;
    }
    /* HATS:glas-karten:ENDE */
    /* HATS:glas-bubble:START */
    /* Bubble braucht BEIDES: Variablen und eine Regel.

       Flaeche, Rand und Schatten liest Bubble aus eigenen --bubble-*-Werten.
       CSS-Regeln kommen nicht ueber Shadow-Grenzen, Variablen schon.

       Die Weichzeichnung dagegen geht NUR ueber eine Regel. Am 13.10.2026 in
       bubble-card.js 3.4.1 nachgesehen: Es gibt genau drei Namen mit "backdrop",
       und alle drei gehoeren zum Abdunkel-Schleier HINTER einem Pop-up
       (.bubble-backdrop, position: fixed) - nicht zur Kartenflaeche.
       .bubble-container traegt ueberhaupt kein backdrop-filter. Eine Variable
       dafuer gibt es also nicht.

       Die Regel steht auf .bubble-container und ausdruecklich NICHT auf :host.
       Ein backdrop-filter auf dem Wirt macht ihn zum Bezugsrahmen fuer
       position: fixed - und Bubble-Pop-ups sind fixed. Sie fielen dann auf die
       Groesse des Wirts zusammen; in HATG gemessen: Hoehe 0 statt 742, nur die
       Kopfzeile schwebte ueber dem Dashboard.

       WELCHE Variablenstufe, das ist die zweite Frage. Jede Eigenschaft loest
       Bubble ueber eine dreistufige Kette auf:

           var(--bubble-card-type-X, var(--bubble-X, <vorgabe>))

       Am 13.10.2026 an acht Karten durchprobiert, je Variable einzeln gesetzt,
       abgelesen am .bubble-container:

           --bubble-card-type-border-radius       0 von 8   wirkungslos
           --bubble-border-radius                 8 von 8
           --bubble-button-border-radius          3 von 8   genau die button-Karten
           --bubble-separator-border-radius       3 von 8   genau die Separatoren
           --bubble-climate-border-radius         1 von 8   genau die Klimakarte
           --bubble-media-player-border-radius    1 von 8   genau der Player

       Die card-type-Stufe setzt Bubble selbst - ein Wert von aussen kommt dort
       nie an. Deshalb hier die ALLGEMEINE Stufe: Sie erreicht jeden Kartentyp und
       laesst Bubbles Typlogik in Ruhe. */
    :host,
    ha-card {
      /* Flaeche aus demselben Feld wie die HA-Karten - damit zieht Bubble mit,
         wenn der Regler bewegt wird. */
      --bubble-main-background-color: var(--ha-card-background, var(--card-background-color));
      --bubble-secondary-background-color: var(--ha-card-background, var(--card-background-color));

      /* Die Lichtkante steckt IM Schatten, nicht in --bubble-border.
         --bubble-border ist ein echtes border und verschiebt das Layout um seine
         Breite - bei einer 56px hohen Bubble-Zeile sieht man das sofort. Ein
         inset-Schatten liegt dagegen in der Flaeche.

         Die Kanten kommen aus --ha-card-box-shadow, nicht als feste Werte hierher.
         Hier standen bis zum 13.10.2026 rgba(255,255,255,.6) und
         rgba(10,20,45,.08) - Hell-Werte. Ein uix-Feld gilt aber fuer Hell und
         Dunkel zugleich, und im Dunkelmodus war die obere Kante damit ein greller
         Strich und die untere unsichtbar. Das Theme-Feld traegt je Modus die
         richtigen vier Schatten; Bubble bekommt damit genau das Bild der
         HA-Karten. */
      --bubble-border: none;
      --bubble-box-shadow: var(--ha-card-box-shadow,
        0 10px 30px rgba(22, 40, 78, .14));
    }

    /* Die Weichzeichnung auf den Container, nicht auf den Wirt. */
    .bubble-container {
      backdrop-filter: var(--ha-card-backdrop-filter, blur(20px) saturate(160%));
      -webkit-backdrop-filter: var(--ha-card-backdrop-filter, blur(20px) saturate(160%));
    }

    /* Eine eingeschaltete Karte legt ihre Zustandsfarbe als Schicht ueber die
       ganze Flaeche - und deckt damit das Glas zu.

       Am 13.10.2026 an fuenf Karten gemessen: Nur die trifft es, die wirklich eine
       Farbe traegt. Bubble setzt die Deckkraft INLINE, deshalb braucht es hier
       !important:

           Keller, Licht an    rgb(209, 209, 195)   opacity 0.7   <- deckt zu
           Buero, Slider       transparent          opacity 0.5
           Buero, Climate      transparent          opacity 1
           Garage, aus         transparent          opacity 0.5

       55 % ist die Wahl des Nutzers, zwischen zwei Nachteilen: Deckend sieht man
       den Zustand klar und das Glas nicht; zu schwach getoent bleibt das Glas, und
       bei einer blassen Lichtfarbe (warmweiss, beige) sieht man kaum noch, dass
       etwas an ist.

       Der AUS-Zustand bleibt unberuehrt. Dort ist die Schicht ohnehin farblos -
       den Unterschied macht die Farbe, nicht die Deckkraft. */
    ha-card.is-on .bubble-background {
      opacity: .55 !important;
    }

    /* Die Klimakarte ist der Sonderfall - und der einzige.

       Am 13.10.2026 an sechs Bubble-Karten gezaehlt: Nur EINE traegt auf
       .bubble-background wirklich eine Farbe, naemlich die Klimakarte. Bei
       Button-, Cover- und Media-Player-Karten ist die Schicht farblos
       (rgba(0,0,0,0)) - die Deckkraft oben laeuft dort also ins Leere.

       Bubble setzt die Zustandsfarbe bei Klima inline und markiert die Schicht
       mit einer eigenen Klasse:

           button / cover / media-player   .bubble-background .bubble-*-background
           climate                         .bubble-background .bubble-color-background

       Mit 55 % deckt das volle Orange die ganze Karte zu - gemeldet: "die Bubble
       heizungskarte braucht anpassung". HA und Mushroom faerben beim selben Geraet
       nur das Symbol und lassen die Flaeche Glas. 22 % bringt die Klimakarte auf
       dasselbe Bild: getoent statt gedeckt, der Zustand bleibt auf einen Blick
       erkennbar.

       Der Selektor braucht ha-card.is-on davor. Eine nackte Klasse verliert gegen
       die Regel darueber - gemessen: .bubble-color-background allein liess die
       Deckkraft auf .55, erst mit dem Vorsatz griff sie. */
    ha-card.is-on .bubble-color-background {
      opacity: .22 !important;
    }

    /* Ein Separator ist eine Ueberschriftenzeile, keine Kachel. Bubble laesst ihn
       schon ohne Flaeche; ohne diese Ausnahme laegen trotzdem Weichzeichnung und
       Lichtkante darauf - ein verschwommener Balken mit heller Oberkante hinter
       jedem Gruppentitel.

       Die Klassen am Container, am 13.10.2026 an acht Karten abgelesen - jeder
       Kartentyp traegt neben .bubble-container noch einen eigenen Namen:

           separator      bubble-container bubble-separator separator-container
           button         bubble-button-container bubble-container …
           climate        bubble-climate-container bubble-container
           media-player   bubble-media-player-container bubble-container

       Damit laesst sich jeder Typ einzeln ansprechen, ohne die Variablenkette zu
       bemuehen. Ein erster Versuch zielte auf .bubble-separator-container - den
       Namen gibt es nicht, und die Ausnahme traf nichts. */
    .bubble-separator,
    .separator-container {
      background: none !important;
      box-shadow: none !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    /* HATS:glas-bubble:ENDE */
    /* HATS:glas-symbolkachel:START */
    /* Kein Pfad noetig: Symbolbehaelter lesen alle eine Rundungs-Variable, und
       Variablen erben durch jede Shadow-Grenze. Ein :host-Block erreicht damit
       Kacheln, Mushroom, Zeilen und Glance auf einmal.

       Bei Mushroom muss es --mush-icon-border-radius sein, nicht
       --icon-border-radius: Mushroom setzt letzteres selbst weiter unten im Baum
       (--icon-border-radius: var(--mush-icon-border-radius, 50%)), ein Wert von
       aussen traegt dort nicht.

       UND BEI BUBBLE: nur die allgemeine Stufe, nicht die typspezifische.

       Bubble loest den Radius ueber eine dreistufige Kette auf:

           var(--bubble-card-type-icon-border-radius,
               var(--bubble-icon-border-radius,
                   var(--bubble-border-radius, 50%)))

       Am 13.10.2026 an fuenf Bubble-Karten durchprobiert, je Variable einzeln
       gesetzt und der berechnete Radius gemessen:

           --bubble-card-type-icon-border-radius   0 von 5   wirkungslos
           --bubble-icon-border-radius             5 von 5
           --bubble-button-icon-border-radius      3 von 5   nur card_type: button
           --bubble-border-radius                  5 von 5   faerbt aber auch Flaechen

       Die ERSTE Stufe setzt Bubble selbst, je Kartentyp - ein Wert von aussen
       kommt dort nie an. Die typspezifischen Namen wie
       --bubble-button-icon-border-radius treffen genau ihren Kartentyp; climate
       und media-player bleiben davon unberuehrt. Deshalb steht hier die
       ALLGEMEINE Stufe, und nur sie: Sie erreicht alle fuenf und laesst Bubbles
       eigene Typlogik in Ruhe.

       (Eine frühere Fassung setzte zusaetzlich die card-type-Stufe. Das war aus
       einer Messung geschlossen, bei der die aktive Theme des Nutzers genau diese
       Stufe belegt hatte - gemessen wurde also deren Wirkung, nicht die eigene.
       Wer bei Bubble misst, legt die laufende Theme vorher stumm.) */
    :host,
    ha-card {
      --ha-tile-icon-border-radius: 28%;
      --state-badge-border-radius: 28%;
      --mush-icon-border-radius: 28%;
      --bubble-icon-border-radius: 28%;
    }
    /* HATS:glas-symbolkachel:ENDE */
    /* HATS:sync-bedienelemente:START */
    /* Alle drei Familien zeigen dieselbe Lampe verschieden. Am 13.10.2026 an
       einer Lampe in rgb(129,173,255) gemessen, bevor etwas angefasst wurde:

           Slider         HA #81adff   Mushroom #81adff   Bubble rgb(119,160,237)
           Symbolflaeche  HA  20 %     Mushroom  25 %     Bubble  Weiss 32 %
           Symbolgroesse  HA  36 px    Mushroom  36 px    Bubble  42 px

       Bubble rechnet die Lichtfarbe selbst ab - rgb(119,160,237) ist dieselbe
       Farbe, um den Faktor .925 abgedunkelt. Dieser Block zieht die anderen
       beiden dorthin nach, statt Bubble aufzuhellen: Der dunklere Ton steht
       besser auf Glas.

       DER FAKTOR .925 IST GEMESSEN, NICHT GEWAEHLT. color-mix(... 92.5%, black)
       ergibt rgb(119,160,236) - Bubbles Wert auf eine Einheit genau. Er bleibt
       als Zahl stehen, weil er Bubbles interne Rechnung nachbildet; ein
       Theme-Feld dafuer waere ein zweiter Ort fuer dieselbe Entscheidung.

       --- Home Assistant ---------------------------------------------------
       Der Slider liegt zwei Shadow-Grenzen tiefer als dieser Block, eine Regel
       erreicht ihn also nie. Der Weg fuehrt ueber die Variablenkette:

           hui-tile-card      setzt  --feature-color: var(--tile-color)
           hui-card-features  setzt  --control-slider-color: var(--feature-color)

       --tile-color steht inline an der ha-card und traegt die Lichtfarbe. Gezielt
       wird auf hui-card-features, weil das Element IN diesem Shadow Root liegt -
       ein Wert an der ha-card wird dort ueberschrieben und kommt nie an. Das
       !important ist noetig, weil die Regel des Bauteils aus adoptedStyleSheets
       kommt und bei Gleichstand immer zuletzt gilt. */
    hui-card-features {
      --feature-color: color-mix(in srgb, var(--tile-color, var(--primary-color)) 92.5%, black) !important;
    }

    /* --- Mushroom ----------------------------------------------------------
       Hier geht der Variablenweg NICHT. Mushroom schreibt die Lichtfarbe inline
       als --slider-color an mushroom-light-brightness-control - also an genau das
       Element, das ueberschrieben werden muesste. Eine Ableitung daraus waere ein
       Zyklus (--slider-color aus --slider-color), und CSS verwirft dann beide
       Deklarationen stillschweigend. Ein Umweg ueber eine Hilfsvariable am selben
       Element schliesst den Zyklus genauso.

       Deshalb filter statt Farbe: brightness(.925) multipliziert jeden Kanal mit
       .925 und ist damit rechnerisch dasselbe wie color-mix(... 92.5%, black) -
       nur greift es an der gemalten Flaeche an und braucht keine Quelle. Es
       faerbt Fuellung und Spur gemeinsam, was hier richtig ist: beide tragen
       dieselbe Farbe.

       ACHTUNG, falls weitere Steuerelemente dazukommen: Ein filter macht sein
       Element zum Bezugsrahmen fuer position: fixed. Diese drei sind geprueft -
       kein fixed-Kind darin. Ein Pop-up-Traeger duerfte hier nicht stehen. */
    mushroom-light-brightness-control,
    mushroom-cover-position-control,
    mushroom-fan-percentage-control {
      filter: brightness(.925);
    }

    /* --- Bubble ------------------------------------------------------------
       Die Farbe bringt Bubble schon mit. Was stoert, ist die Deckkraft: Bubble
       legt .7 ueber die Fuellung, waehrend HA und Mushroom voll deckend malen.

           .slider-use-light-color { background-color: ...; opacity: 0.7 }

       Nebenbei: --bubble-slider-color gibt es NICHT. Bubble 3.2.0 nennt den Namen
       kein einziges Mal; gelesen wird --bubble-slider-fill-color, und das setzt
       Bubble inline. Wer in einer Kartenkonfiguration var(--bubble-slider-color,
       var(--accent-color)) schreibt, trifft also immer nur den Ausweichwert. */
    .bubble-range-fill.slider-use-light-color {
      opacity: 1 !important;
    }

    /* --- Symbolflaeche: ueberall die Zustandsfarbe bei 25 % ----------------
       HA zeichnet sie als ::before auf .background, mit opacity .2 aus
       --tile-icon-opacity. Mushroom steht bereits auf 25 %, bleibt also
       unberuehrt. --tile-icon-opacity setzt das Bauteil in seinem eigenen :host,
       deshalb !important. */
    ha-tile-icon {
      --tile-icon-opacity: .25 !important;
    }

    /* Bubble haelt keine Zustandsfarbe als Variable bereit - alle naheliegenden
       Namen (--bubble-light-color, --bubble-accent-color, --bubble-state-color)
       sind leer. Die Farbe steht als color am Container, also ist currentColor
       die Quelle.

       Die Groesse kommt aus min-width/min-height (42 px), nicht aus einer
       Variablen: Bubbles Stylesheet kennt ueberhaupt keinen --bubble-*-size-Namen
       fuer den Symbolbehaelter. Darum eine Regel - und damit 36 px wie bei den
       anderen beiden. */
    .bubble-icon-container {
      background-color: color-mix(in srgb, currentColor 25%, transparent) !important;
      min-width: 36px !important;
      min-height: 36px !important;
    }
    /* HATS:sync-bedienelemente:ENDE */
    /* HATS:glas-knoepfe:START */
    /* Nur Variablen, keine Regeln auf das Innere des Knopfes.

       Der naheliegende Weg waere ha-icon-button::part(base) - das innere .button
       von ha-button. Am 13.10.2026 an der Instanz gemessen: Er funktioniert NICHT
       von hier aus. ::part reicht genau EINE Shadow-Grenze durch, und ha-button
       traegt kein exportparts; von der Karte aus liegen aber zwei Grenzen
       dazwischen (Karte -> ha-icon-button -> ha-button). Die Regel kam an und traf
       nichts:

           ha-icon-button ha-button::part(base) { background-color: … !important }
           -> gemessen: rgba(0, 0, 0, 0), also unveraendert

       In HATG geht das, weil dort eine Pfadangabe das CSS direkt in den Shadow
       Root von ha-icon-button legt (uix-card-yaml mit "ha-icon-button $"). HATS
       kennt diese Pfadform bewusst nicht - ein -yaml-Feld verdeckt sein einfaches
       Feld vollstaendig, und das ist eine Falle, die HATS sich nicht einhandelt.

       Was ohne Pfad geht, sind Variablen: Die erben durch jede Shadow-Grenze.
       Die Fuellung des Knopfes gehoert nicht dazu - ha-button steht auf
       appearance="plain" und setzt dort ein hartes background-color ohne Variable
       davor. Groesse, Form und Rueckmeldung dagegen schon. */
    :host,
    ha-card {
      --ha-icon-button-size: 40px;
      --ha-button-border-radius: 14px;
      /* Die Klick-Welle in der Akzentfarbe statt in Grau - das ist die einzige
         Farbe am Knopf, die von aussen erreichbar ist. */
      --ha-ripple-color: var(--accent-color);
      --ha-ripple-hover-opacity: 0.1;
      --ha-ripple-pressed-opacity: 0.16;
    }
    /* HATS:glas-knoepfe:ENDE */
  uix-dialog: |-
    /* HATS:glas-dialoge:START */
    /* KEIN backdrop-filter auf der Dialogflaeche.

       Ein Filter macht den Dialog zum Bezugsrahmen fuer position: fixed. Die
       Auswahllisten darin sind fixed: Sie landen neben dem sichtbaren Bereich,
       und die Liste bleibt leer. An der Versionsauswahl von HACS und am
       Info-Dialog von HA gemessen. Ein Filter auf einem ::before hilft nicht.

       Welcher Selektor unter HA 2026 traegt, ist am 13.10.2026 an einem offenen
       Info-Dialog gemessen: In keinem der Dialog-Bauteile kommt noch eine einzige
       mdc-Klasse vor. Der Dialog ist eine wa-dialog von Web Awesome, und sie gibt
       ihre Flaeche als CSS-Teil nach aussen - ein Teil reicht durch die
       Shadow-Grenze, deshalb greift wa-dialog::part(dialog) von hier aus.
       Nachgemessen: Radius 26px, Schatten gesetzt.

       Die mdc-Zeile bleibt trotzdem stehen. Sie ist unter HA 2026 tot, aber wer
       eine aeltere Instanz faehrt, braucht sie - und eine tote Zeile kostet
       nichts. Die Korrektur gehoert als ZUSAETZLICHER Selektor geschrieben, nicht
       als Ersatz. */
    .mdc-dialog__surface,
    wa-dialog::part(dialog),
    wa-drawer::part(dialog) {
      border-radius: var(--ha-dialog-border-radius, 26px) !important;
      box-shadow:
        0 24px 70px rgba(0, 0, 0, .28),
        inset 0 1px 0 rgba(255, 255, 255, .5) !important;
      backdrop-filter: none !important;
      -webkit-backdrop-filter: none !important;
    }
    /* HATS:glas-dialoge:ENDE */
  uix-grid-section: |-
    /* HATS:abschnitte-trennen:START */
    /* Auf einem Sections-Dashboard stehen die Abschnitte in einem Raster und
       brechen um. Wo zwei Reihen aufeinandertreffen, laeuft der letzte Inhalt der
       oberen direkt in die Ueberschrift der unteren - gemeldet am 13.10.2026:
       "kannst du hier eine trennlienie ziehen das die reihen optisch getrennt
       sind."

       Als ::before, nicht als border-top: Ein echtes border verschiebt den
       Abschnitt um seine Breite nach unten, und bei sechs Abschnitten summiert
       sich das sichtbar. Ein absolut gesetztes ::before liegt ausserhalb des
       Flusses und kostet keinen Platz.

       :host steht im Normalfall auf position: static - an der laufenden Instanz
       nachgemessen. Ohne das relative Hostelement bezoege sich das ::before auf
       das naechste positionierte Element weiter oben und liefe quer ueber die
       Seite.

       JEDER Abschnitt bekommt die Linie, auch der erste. Eine Ausnahme fuer den
       ersten geht nicht: Jede hui-grid-section ist das einzige Kind ihrer eigenen
       hui-section, :first-of-type trifft also auf alle zu. Ueber der ersten Reihe
       steht die Linie unter der Kopfleiste und liest sich dort als Abschluss. */
    :host {
      position: relative;
    }

    :host::before {
      content: "";
      position: absolute;
      inset-inline: 0;
      inset-block-start: -14px;
      height: 1px;
      /* Dieselbe Farbe wie jede andere Trennlinie in Home Assistant, und je Modus
         im Theme gesetzt - im Hellen dunkel, im Dunkeln hell. */
      background: var(--divider-color);
      /* Die Linie liegt ueber der Flaeche und darf keine Klicks abfangen. */
      pointer-events: none;
    }
    /* HATS:abschnitte-trennen:ENDE */
  uix-more-info: |-
    /* HATS:glas-more-info:START */
    /* :host ist hier ha-more-info-dialog. Auch hier keine Weichzeichnung auf
       der Flaeche - aus demselben Grund wie bei den uebrigen Dialogen. */
    wa-dialog::part(dialog),
    wa-drawer::part(dialog),
    .mdc-dialog__surface {
      border-radius: var(--ha-dialog-border-radius, 26px) !important;
      box-shadow:
        0 24px 70px rgba(0, 0, 0, .3),
        inset 0 1px 0 rgba(255, 255, 255, .45) !important;
    }
    /* HATS:glas-more-info:ENDE */
  uix-root: |-
    /* HATS:glas-kopfleiste:START */
    /* Das Ziel ist uix-root, NICHT uix-top-app-bar-fixed.

       Am 13.10.2026 an einem Dashboard gemessen: ha-top-app-bar-fixed existiert
       dort ueberhaupt nicht - null Elemente. Die Kopfleiste eines Dashboards sind
       zwei divs im Shadow Root von hui-root:

           div.header    56px hoch
           div.toolbar   56px hoch

       ha-top-app-bar-fixed traegt die Leiste auf den EINSTELLUNGSSEITEN; dafuer
       gibt es die Vorlage daneben.

       Dieselbe Vorlage war in HATG eine Weile tot, ohne dass es auffiel: Der
       UIX-Knoten kam an, der Selektor traf nichts, und die Leiste SAH trotzdem
       richtig aus - weil die Farbe aus --app-header-background-color kommt, das
       die Leiste selbst liest. Nur verschwommen war nichts. Das ist der Grund,
       warum hier jeder Selektor nachgemessen ist. */
    .header,
    .toolbar {
      backdrop-filter: var(--app-header-backdrop-filter, blur(22px) saturate(170%));
      -webkit-backdrop-filter: var(--app-header-backdrop-filter, blur(22px) saturate(170%));
      box-shadow: none !important;
    }
    .header {
      border-bottom: 1px solid rgba(255, 255, 255, .16);
    }
    /* HATS:glas-kopfleiste:ENDE */
    /* HATS:hintergrund-bewegung:START */
    /* Treiben und Farbwechsel bewegen die Flaeche selbst, mit transform und
       filter - beides rechnet die Grafikkarte, ohne dass neu gemalt wird. */
    hui-view-background {
      /* Fest am Fenster und rundum 14 % groesser, damit beim Verschieben kein
         Rand ins Bild laeuft. Home Assistant deckelt die Breite sonst auf 100 %. */
      position: fixed !important;
      inset: -14% !important;
      width: 128% !important;
      height: 128% !important;
      max-width: none !important;
      max-height: none !important;
      animation: hats-hintergrund-drift 20s ease-in-out infinite alternate, hats-hintergrund-farbe 150s ease-in-out infinite alternate;
      will-change: transform, filter;
    }
    @keyframes hats-hintergrund-drift {
      0% { transform: translate3d(0, 0, 0) scale(1) rotate(0deg); }
      33% { transform: translate3d(-7%, 4%, 0) scale(1.08) rotate(-3deg); }
      66% { transform: translate3d(6%, -4%, 0) scale(1.04) rotate(2deg); }
      100% { transform: translate3d(-3%, 7%, 0) scale(1.12) rotate(-1.5deg); }
    }
    @keyframes hats-hintergrund-farbe {
      from { filter: hue-rotate(-2.5deg); }
      to { filter: hue-rotate(2.5deg); }
    }
    /* Wer am Geraet "Bewegung reduzieren" eingestellt hat, bekommt keine. */
    @media (prefers-reduced-motion: reduce) {
      hui-view-background { animation: none !important; }
    }
    /* HATS:hintergrund-bewegung:ENDE */
  uix-sidebar: |-
    /* HATS:glas-seitenleiste:START */
    /* Die Flaechenfarbe kommt aus dem Theme-Feld sidebar-background-color.
       Die Weichzeichnung bietet HA als Feld nicht an, sie steht deshalb als
       fester Wert hier - mit var() davor, falls es das Feld doch einmal gibt. */
    :host {
      backdrop-filter: var(--sidebar-backdrop-filter, blur(24px) saturate(170%));
      -webkit-backdrop-filter: var(--sidebar-backdrop-filter, blur(24px) saturate(170%));
    }

    /* Der aktive Eintrag als Pille.

       Am 13.10.2026 an der laufenden Instanz nachgesehen, welcher Selektor ihn
       wirklich trifft - die drei naheliegenden trafen NULL Elemente:

           .iron-selected                            0   (Polymer, lange her)
           a[role="option"][aria-selected="true"]    0
           ha-md-list-item[selected]                 0
           .selected                                 1   <- dieser

       Der aktive Eintrag ist ein ha-list-item-button.selected in einer
       ha-list-nav. Die drei alten bleiben als zusaetzliche Selektoren stehen: Wer
       eine aeltere HA faehrt, braucht sie, und eine tote Zeile kostet nichts.

       DIE FLAECHE LIEGT IM ::before, NICHT AM ELEMENT. Gemeldet am 13.10.2026,
       der Eintrag sah aus wie ein abgeschnittener Rahmen. Gemessen:

           Element      background rgba(0,0,0,0)   border-radius 999px
           ::before     background --sidebar-selected-icon-color
                        border-radius var(--ha-border-radius-sm)   also 4px
                        opacity      var(--dark-divider-opacity)   also .12

       Das Element nur zu runden rundet also nichts Sichtbares: Die runde Linie
       kam vom inset-Schatten und gehoerte zu einer Flaeche, die darunter als
       4px-Rechteck mit 12 Prozent Deckkraft lag. Die Rundung muss ans ::before. */
    ha-list-item-button.selected,
    .selected,
    .iron-selected,
    a[role="option"][aria-selected="true"],
    ha-md-list-item[selected] {
      border-radius: 999px !important;
      /* Nur ein INNERER Schatten. Ein Aussenschatten wird von ha-list-nav
         abgeschnitten (overflow: hidden auto) und steht dann als dunkles Rechteck
         um die runde Pille. */
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .2) !important;
    }

    /* Die Flaeche selbst: rund, in der Akzentfarbe, voll deckend.

       opacity bleibt bei 1 statt bei HAs .12 - sonst traegt die Pille keine
       Farbe, und genau das war der gemeldete Fehler. Die Akzentfarbe ist je Modus
       im Theme gesetzt, der Block gilt also fuer beide. */
    ha-list-item-button.selected::before,
    .selected::before {
      border-radius: 999px !important;
      background-color: var(--accent-color) !important;
      opacity: 1 !important;
    }

    /* Schrift und Symbol auf der Akzentflaeche. HA faerbt beide mit
       --sidebar-selected-icon-color, und das ist jetzt die FLAECHE - ohne diesen
       Block stuende der Text in seiner eigenen Hintergrundfarbe.

       --text-accent-color ist HAs Name fuer "Schrift auf einer Akzentflaeche";
       faellt sie aus, traegt --text-primary-color. */
    ha-list-item-button.selected::part(headline),
    ha-list-item-button.selected ha-svg-icon[slot="start"],
    ha-list-item-button.selected ha-icon[slot="start"] {
      color: var(--text-accent-color, var(--text-primary-color)) !important;
    }
    /* HATS:glas-seitenleiste:ENDE */
  uix-theme: "glaswerk"
  uix-toast: |-
    /* HATS:glas-toast:START */
    :host,
    .toast,
    ha-toast {
      backdrop-filter: blur(20px) saturate(170%);
      -webkit-backdrop-filter: blur(20px) saturate(170%);
      border-radius: 18px;
      box-shadow:
        0 12px 36px rgba(0, 0, 0, .22),
        inset 0 1px 0 rgba(255, 255, 255, .4);
    }
    /* HATS:glas-toast:ENDE */
  uix-top-app-bar-fixed: |-
    /* HATS:glas-kopfleiste-einstellungen:START */
    /* Beide Schreibweisen, nicht nur eine: Unter HA 2026 heisst die Klasse
       .top-app-bar, bis HA 2025 hiess sie .mdc-top-app-bar. Wer die alte streicht,
       nimmt aelteren Instanzen die Vorlage weg. In 629 Elementen einer
       Einstellungsseite kommt unter HA 2026 keine einzige mdc-Klasse mehr vor. */
    .mdc-top-app-bar,
    .top-app-bar,
    header.top-app-bar {
      backdrop-filter: var(--app-header-backdrop-filter, blur(22px) saturate(170%));
      -webkit-backdrop-filter: var(--app-header-backdrop-filter, blur(22px) saturate(170%));
      box-shadow: none !important;
      border-bottom: 1px solid rgba(255, 255, 255, .16);
    }
    /* HATS:glas-kopfleiste-einstellungen:ENDE */
